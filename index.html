<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ASTRA: software de monitoreo de salud para astronautas en misiones espaciales. NASA Space Apps Challenge 2026.">
  <title>ASTRA · Monitoreo de salud espacial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand__name">ASTRA</span>
        <span class="brand__sub" data-i18n>Monitoreo de salud espacial</span>
      </div>
      <nav id="nav" class="nav" aria-label="Secciones" data-i18n-attr="aria-label"></nav>
      <p class="sidebar__foot">NASA Space Apps Challenge 2026</p>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <h1 id="view-title"></h1>
        <div class="topbar__controls">
          <label class="control"><span data-i18n>Astronauta</span> <select id="crew-select"></select></label>
          <label class="control"><span data-i18n>Entorno</span> <select id="env-select"></select></label>
          <div class="readout"><span data-i18n>Misión</span><strong id="mission-clock"></strong></div>
          <div class="readout"><span data-i18n>Alertas</span><strong id="alert-count" class="counter">0</strong></div>
          <div class="lang" role="group" aria-label="Idioma / Language">
            <button type="button" data-lang="es" aria-pressed="true" title="Español">ES</button>
            <button type="button" data-lang="en" aria-pressed="false" title="English">EN</button>
          </div>
        </div>
      </header>

      <main id="view-3d" class="layout" hidden>
        <aside id="panel-left" class="panel" aria-label="Resumen" data-i18n-attr="aria-label"></aside>
        <section id="stage" class="stage" aria-label="Vista 3D" data-i18n-attr="aria-label">
          <p class="stage__hint" data-i18n>Arrastra para girar · rueda para acercar · clic para seleccionar</p>
          <ul id="alert-log" class="log" aria-live="polite"></ul>
        </section>
        <aside id="panel-right" class="panel" aria-label="Detalle" data-i18n-attr="aria-label"></aside>
      </main>

      <main id="view-page" class="page" hidden></main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>ASTRA necesita JavaScript para funcionar. / ASTRA needs JavaScript to run.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
